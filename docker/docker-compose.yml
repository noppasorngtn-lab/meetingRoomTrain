# Local dev stack (/dev:deploy --env dev). Services come only from the stack's closed list:
# stack.database (postgresql) · stack.tools[] mailpit (dev stand-in for the smtp relay, DEC-005 open) · the two apps.
# Secrets come from docker/.env (see .env.example) — never written here.
name: mrr

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: mrr
      POSTGRES_USER: mrr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrr -d mrr"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://mrr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@db:5432/mrr
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@mrr.local
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # No /health route exists; until the sign-in guard lands (GAP-mrr-003) every route answers 401,
      # so exactly 401 from /auth/me means Nest is up and routing — any other answer is unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/auth/me').then((r)=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3000
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173/').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
